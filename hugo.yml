module:
  mounts:
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: content
      target: content
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts
params:

  # Hugolify admin
  admin:
    collections:
      casestudies:
        enable: true
        filter:
          - field: isIndex
            value: false
        icon:
          bootstrap_icons: journals
          iconoir: book-stack
          lucide: notebook
          material_icons: web_stories
          material_symbols: web_stories

  # Image
  casestudies:
    thumbnail:
      desktop: '416x179'
      mobile: '300x129'
      scrollsnap: '240x103'
      sizes: 100vw, 50vw, 33vw

# Default
permalinks:
  page:
    casestudies: /case-studies/:slug/
  section:
    casestudies: /case-studies/
